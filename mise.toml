# Project-local auxiliary tooling for repository maintenance.
# Machine-wide provisioning remains owned by rebuildup/pc-setup.

[tools]
bun = "1.4.2"

[tasks.skills-list]
description = "List Agent Skills available from rebuildup/project-init"
run = "bunx skills add rebuildup/project-init --list"

[tasks.skills-bootstrap]
description = "Install project-init Skills for Claude Code and universal .agents/skills consumers"
run = "bunx skills add rebuildup/project-init --skill '*' --agent claude-code --agent codex -y"

[tasks.skills-update]
description = "Update tracked project-local Agent Skills non-interactively"
run = "bunx skills update -p -y"
