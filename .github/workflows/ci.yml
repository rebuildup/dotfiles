name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release-*'

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: bash -n script/link script/check script/test script/bootstrap script/secrets-doctor script/with-secrets script/check-secrets script/test-workflow script/agent/minimax script/agent/mimo config/agent-init.bash
      - name: Test symlink behavior
        run: ./script/test
      - name: Test bootstrap and Infisical workflow
        run: ./script/test-workflow
      - name: Validate global mise agent tasks
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import tomllib

          file = pathlib.Path("home/.config/mise/conf.d/agent-routes.toml")
          tasks = tomllib.loads(file.read_text())["tasks"]
          assert len(tasks) == 10
          for name, task in tasks.items():
              assert task["dir"] == "{{ cwd }}", name
              subprocess.run(["bash", "-n"], input=task["run"], text=True, check=True)
          print(f"validated {len(tasks)} global mise tasks")
          PY
      - name: Guard secret material
        run: ./script/check-secrets
