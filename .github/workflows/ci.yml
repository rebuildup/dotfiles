name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release-*'

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: bash -n script/link script/check script/test script/bootstrap script/secrets-doctor script/with-secrets script/check-secrets script/test-workflow script/agent/mimo script/agent/claude-mimo
      - name: Test symlink behavior
        run: ./script/test
      - name: Test bootstrap and Infisical workflow
        run: ./script/test-workflow
      - name: Guard secret material
        run: ./script/check-secrets
