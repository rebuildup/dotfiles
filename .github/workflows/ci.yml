name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release-*'

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: bash -n script/link script/check script/test script/bootstrap script/secrets-doctor script/with-secrets script/check-secrets script/test-workflow script/agent/minimax script/agent/mimo home/.local/bin/agent config/agent-init.bash
      - name: Test symlink behavior
        run: ./script/test
      - name: Test bootstrap and Infisical workflow
        run: ./script/test-workflow
      - name: Validate agent launcher config
        run: |
          python3 - <<'PY'
          import pathlib

          for name in ("script/agent-launcher", "script/test-agent"):
              compile(pathlib.Path(name).read_text(), name, "exec")
              print(f"compiled {name}")
          PY
          ./script/agent-launcher check
          ./script/agent-launcher list > /dev/null
          ./script/agent-launcher models zen > /dev/null
      - name: Test agent launcher (mock harnesses)
        run: ./script/test-agent
      - name: Guard secret material
        run: ./script/check-secrets
