name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release-*'

permissions:
  contents: read

jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: while IFS= read -r f; do bash -n "$f"; done < script/shell-files.txt
      - name: Install ShellCheck
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y shellcheck
          else
            brew install shellcheck
          fi
      - name: Lint shell scripts (ShellCheck)
        run: shellcheck -s bash -x $(cat script/shell-files.txt)
      - name: Compile-check Python scripts
        run: python3 -m py_compile script/snippet-sync.py
      - name: Validate JSON files
        run: |
          git ls-files '*.json' | while IFS= read -r f; do
            bun -e "JSON.parse(await Bun.file(process.argv[1]).text())" "$f" || { echo "invalid JSON: $f"; exit 1; }
          done
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - name: Install dev dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck agent router (strict)
        run: bun run typecheck
      - name: Test symlink behavior
        run: ./script/test
      - name: Test bootstrap and Infisical workflow
        run: ./script/test-workflow
      - name: Validate agent launcher config
        run: |
          bun script/agent.ts check
          bun script/agent.ts list > /dev/null
          bun script/agent.ts models zen > /dev/null
          bun script/agent.ts models opencode-go > /dev/null
          bun script/agent.ts shortcuts > /dev/null
      - name: Test agent launcher (mock harnesses)
        run: bun test script/agent.test.ts script/claude-settings.test.ts script/devices.test.ts
      - name: Test agent router modules
        run: bun test $(ls script/agent.*.test.ts script/agent/*.test.ts 2>/dev/null | grep -v windows)
      - name: Guard secret material
        run: ./script/check-secrets

  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - name: Validate agent launcher config (Windows)
        run: bun script/agent.ts check
      - name: Test Windows layers (batch shims, .cmd shortcuts, PowerShell wrapper)
        run: bun test script/agent.test.ts script/agent.windows.test.ts script/agent.entrypoint.windows.test.ts script/devices.test.ts
      - name: Test Windows link adapter (adoption-first symlinks)
        run: bun test script/link.windows.test.ts
      - name: Parse-check PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.ps1 script, home -ErrorAction SilentlyContinue
          $bad = 0
          foreach ($f in $files) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs.Count -gt 0) {
              Write-Output "PARSE FAIL: $($f.FullName)"
              $errs | ForEach-Object { Write-Output "  $($_.Message)" }
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Output "PS1 PARSE OK: $($files.Count) files"
