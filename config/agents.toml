# --- $0 free-tier continuity profiles (ADR-0018, measured 2026-11-13) -------
#
# These are the 429 safety nets for the paid allowances: when the primary's
# allowance is exhausted, an explicitly authorized run may continue on another
# FREE route. They are still opt-in — `agent <harness> <provider>` never
# switches on its own, and `agent fallback <id>` only resolves/displays.
#
# The resolver enforces the important part mechanically: every candidate's
# declared `billing` must match the provider's catalogued billing model, a
# `free` candidate may not carry a positive `max_spend`, and a candidate that
# shares the primary's quota scope is rejected as not-fresh capacity. So a
# `global_max_spend = 0` profile cannot authorise any spend even if a
# candidate is later mislabelled.
#
# `credential = "infisical"` matches Kilo/Requesty/Groq (all require_infisical).
# OVHcloud is anonymous and deliberately NOT a candidate: its 2 req/min budget
# cannot carry an agentic turn, and `anonymous` providers have no credential
# source to name here.

[fallback_profile.free-kilo-quota]
id = "free-kilo-quota"
version = 1
description = "Continue at $0 when the Kilo free allowance is exhausted (same-harness: Kilo -> Groq)"
primary_route = "omp.kilo"
authorized_at = "2026-11-13T00:00:00Z"
authorized_by = "operator-authorized $0 free-tier continuity (ADR-0018)"
expires_at = "2026-12-31T23:59:59Z"
global_max_spend = 0
candidates = [
  { route = "omp.groq", model = "openai/gpt-oss-120b", billing = "free", credential = "infisical", max_spend = 0, scope = "local-writes", note = "Independent free account; 8k tokens/min, slow (320s) but functional" },
]

# Same-harness means the candidates must be routes of the primary's harness:
# OMP has no native Requesty or OVHcloud provider, so an omp profile cannot
# list them. Use `opencode-requesty-quota` when OpenCode is the harness.
[fallback_profile.opencode-requesty-quota]
id = "opencode-requesty-quota"
version = 1
description = "Continue at $0 when the Requesty free allowance is exhausted (OpenCode: Requesty -> Kilo)"
primary_route = "opencode.requesty"
authorized_at = "2026-11-13T00:00:00Z"
authorized_by = "operator-authorized $0 free-tier continuity (ADR-0018)"
expires_at = "2026-12-31T23:59:59Z"
global_max_spend = 0
candidates = [
  { route = "opencode.kilo", model = "nvidia/nemotron-3-ultra-550b-a55b:free", billing = "free", credential = "infisical", max_spend = 0, scope = "local-writes", note = "Independent free account; 200 req/hour anonymous tier, per-upstream limits" },
]

