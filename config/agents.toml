# config/agents.toml — declarative harness/provider routes for the unified
# `agent` launcher (script/agent.ts, run by Bun).
#
# This file is the source of truth for providers (endpoint, credential
# secret/env names, models), harnesses (command, adapter) and routes
# (which harness may start which provider). Adding or changing a model,
# endpoint, credential mapping or route is a TOML edit only; the launcher
# source hardcodes none of them.
#
# Security rules:
#   - Never store secret VALUES here, only Infisical secret NAMES.
#   - Credentials are injected process-scoped through the existing
#     script/with-secrets (self-hosted Infisical, project binding tracked,
#     environment `dev`). The launcher filters the injected environment so
#     only the selected provider's credential reaches the harness process.
#   - No implicit provider switching, no silent model fallback, no quota
#     failover. Unknown or unconfigured combinations fail fast with a
#     message that lists the supported ones.
#   - Plain `claude` (without `agent`) always keeps official native auth.
#   - `agent <harness>` without a provider runs that harness NATIVELY:
#     no route lookup and no environment injection whatsoever (the
#     harness's own subscription/account auth). Model flags still need a
#     provider route; a failed route never falls back to native.

[defaults]
# Environment names that must never reach a harness child process: either
# they are Infisical secrets of other providers, or the launcher re-derives
# them itself. A name the current route keeps (provider secret/env) always
# wins over this list. Variables injected by script/with-secrets that are not
# in the route's keep set are dropped regardless of this list.
drop_env = [
  # Claude adapter protocol vars (re-derived per route)
  "ANTHROPIC_API_KEY",
  "ANTHROPIC_AUTH_TOKEN",
  "ANTHROPIC_BASE_URL",
  "ANTHROPIC_MODEL",
  "ANTHROPIC_SMALL_FAST_MODEL",
  "ANTHROPIC_DEFAULT_OPUS_MODEL",
  "ANTHROPIC_DEFAULT_SONNET_MODEL",
  "ANTHROPIC_DEFAULT_HAIKU_MODEL",
  "CLAUDE_CODE_SUBAGENT_MODEL",
  # Credential names of every provider known here, including legacy names
  "DEEPSEEK_API_KEY",
  "MIMO_API_KEY",
  "MINIMAX_API_KEY",
  "MISTRAL_API_KEY",
  "MINIMAX_M_PLAN_KEY",
  "MINIMAX_TOKEN_PLAN_KEY",
  "OPENCODE_API_KEY",
  "OPENROUTER_API_KEY",
  "GROQ_API_KEY",
  "KILO_API_KEY",
  "MODELSCOPE_API_KEY",
  "REQUESTY_API_KEY",
  "SENSENOVA_API_KEY",
  "SILICONFLOW_API_KEY",
  # OMP model-role selectors. The launcher pins every role with explicit
  # flags on Infisical-backed routes, so an ambient value must never redirect
  # a route. Profile selection is not dropped silently: the OMP guard rejects
  # an ambient/dotenv profile or relocated agent directory on those routes.
  "PI_SMOL_MODEL",
  "PI_SLOW_MODEL",
  "PI_PLAN_MODEL",
  # Launcher/Infisical material, not harness material
  "INFISICAL_TOKEN",
  "INFISICAL_ACCESS_TOKEN",
]

# ---------------------------------------------------------------------------
# Providers: endpoint + credential + model catalog (provider-native ids).
# ---------------------------------------------------------------------------

[providers.openrouter]
label = "OpenRouter"
# Anthropic-compatible endpoint, used by the claude adapter.
base_url = "https://openrouter.ai/api"
# Infisical secret name in environment `dev`.
secret = "OPENROUTER_API_KEY"
# Environment variable the harness itself reads (same name here).
env = "OPENROUTER_API_KEY"
default_model = "z-ai/glm-5.3-flash"
models = [
  "z-ai/glm-5.3-flash",
  "z-ai/glm-5.3",
  "deepseek/deepseek-v4.1-flash",
  "deepseek/deepseek-v4-flash",
  "deepseek/deepseek-v4-pro",
]

# Free-only slice of OpenRouter. Policy (issue #76): the normal route has ONE
# fixed model — no runtime catalog/quality/availability selection and no
# `openrouter/free` meta-router. The single allowlist entry is the only model
# the route accepts; any other id (free or paid) fails closed before a process
# starts, so another model can never be reached implicitly or by a typo.
#
# This allowlist does NOT detect the selected id itself becoming paid, nor a
# provider-side retirement: pricing/availability changes are outside the
# launcher's view. Re-check the live catalog/pricing before relying on it, and
# configure an OpenRouter account spend limit (a hard cap that rejects
# requests) as the hard stop. An alert only notifies; it does not stop usage.
#
# Default verified live on 2026-11-01:
#   - public /api/v1/models: pricing.prompt = "0", pricing.completion = "0",
#     tools supported, no expiry;
#   - real E2E response + Bash tool call on claude 2.1.314, the then-current
#     Pi worker (1.4.0) and opencode 2.2.3 on 2026-11-01;
#   - OMP 18.16.0 real response + Bash tool call on 2026-11-04.
# Re-check the catalog before changing this id; do not add experimental models
# here. Same endpoint and credential as the paid `openrouter` provider, so no
# new Infisical secret is needed. Free-tier limits are account-based
# (1000 req/day after >= $10 purchase history, 20 req/min); the paid
# `openrouter` route remains the explicit path beyond that.
[providers.openrouter-free]
label = "OpenRouter (free models)"
base_url = "https://openrouter.ai/api"
secret = "OPENROUTER_API_KEY"
env = "OPENROUTER_API_KEY"
default_model = "nvidia/nemotron-3-ultra-550b-a55b:free"
# OpenCode addresses OpenRouter as its native provider id `openrouter` (the
# paid provider above relies on the key == opencode_id default); the free
# provider must map to the same id or OpenCode would see an unknown provider.
opencode_id = "openrouter"
# OMP likewise knows OpenRouter natively as provider id `openrouter`; the
# launcher route key `openrouter-free` is launcher-side routing only.
omp_id = "openrouter"
models = ["nvidia/nemotron-3-ultra-550b-a55b:free"]

[providers.deepseek]
label = "DeepSeek"
base_url = "https://api.deepseek.com/anthropic"
secret = "DEEPSEEK_API_KEY"
env = "DEEPSEEK_API_KEY"
default_model = "deepseek-flash"
# Verified live native ids (deepseek-chat / deepseek-reasoner retired 2026-07-24).
models = ["deepseek-flash", "deepseek-v4-pro"]

[providers.minimax]
label = "MiniMax (M Plan)"
base_url = "https://api.minimax.io/anthropic"
secret = "MINIMAX_M_PLAN_KEY"
env = "MINIMAX_API_KEY"
# MiniMax-M3.1-Flash officially released 2026-10-19; this is the
# documented model ID. Live M Plan entitlement validation for the formal
# ID is still required; /v1/models can omit reachable model IDs.
# Unknown IDs fail closed before a process starts.
#
# M3.1 Flash model-specific contract (do not silently violate):
#   - Reasoning is always on; the launcher never sets `thinking: disabled`
#     or `effort: none` for this id.
#   - Effort accepts only low/medium/high/xhigh/max and defaults to `max`
#     when no value is passed.
default_model = "MiniMax-M3.1-Flash"
models = [
  "MiniMax-M3.1-Flash",
  "MiniMax-M3",
  "MiniMax-M2.7",
  "MiniMax-M2.7-highspeed",
  "MiniMax-M2.5",
  "MiniMax-M2.5-highspeed",
  "MiniMax-M2.1",
  "MiniMax-M2.1-highspeed",
  "MiniMax-M2",
]

[providers.zen]
label = "OpenCode Zen"
# No Anthropic-compatible endpoint is verified for zen, so there is no
# `claude` route for it: zen free-tier models answer only inside OpenCode
# clients (verified: 403 from pi).
secret = "OPENCODE_API_KEY"
env = "OPENCODE_API_KEY"
default_model = "mimo-v2.6-flash-free"
# OpenCode addresses this provider as `opencode` (provider-native id differs
# from this route key); the adapter prefixes `<opencode_id>/<model>`.
opencode_id = "opencode"
models = [
  "mimo-v2.6-flash-free",
  "big-pickle",
  "beam-free",
  "jev-1.13-free",
  "deepseek-v4.1-flash-free",
  "glm-5.3-flash-free",
  "longcat-2.5-preview-free",
  "nemotron-3.5-lightning-free",
  "nemotron-3.5-super-vl-free",
  "space-bunny-free",
]

# OpenCode Go ($10/month subscription). There is **no separate Go key**:
# the same account/workspace key (`OPENCODE_API_KEY`) serves Zen and Go, and
# the endpoint selects which allowance a request consumes (Go allowance here,
# Zen/pay-as-you-go elsewhere). The launcher guarantee is instead:
#   - always take the value from Infisical (`require_infisical`), never a
#     stale ambient shell value: the ambient credential names are removed
#     before the with-secrets stage, so a missing Infisical value fails;
#   - OMP-side models.yml/models.yaml/models.json overrides and stored
#     opencode-go credentials are rejected before launch;
#   - no fallback to Zen, pay-as-you-go or another model on failure.
#
# Go usage is metered against the subscription allowance per model
# (5h / weekly / monthly). Extra Usage (pay-as-you-go overflow) must be OFF in
# the Console while this route is meant to be flat-rate; the launcher cannot
# see or change that account setting and must not pretend it did.
#
# Model ids are native Go ids, verified live against the public
# https://opencode.ai/inference/go/v1/models catalog on 2026-11-01.
[providers.opencode-go]
label = "OpenCode Go"
# Anthropic-compatible Go endpoint for Claude Code. OMP uses its own native Go
# base URL (https://opencode.ai/inference/go/v1) from its provider catalog.
base_url = "https://opencode.ai/inference/go/anthropic"
secret = "OPENCODE_API_KEY"
env = "OPENCODE_API_KEY"
# Always source from Infisical; ignore ambient env and OMP-local overrides.
require_infisical = true
models = ["deepseek-v4.1-flash", "mimo-v2.6-flash"]

# Logfare (https://logfare.ai/docs): OpenAI-compatible endpoint with one API
# key. Explicit opt-in route only. The launcher has no automatic routing or
# fallback at all, and this provider must never become one: the regular
# account budget is 40 req/min, 1,000 req/hour, 5,000 req/day with 6
# concurrent requests (new accounts: 10/min, 200/hour, 500/day, 2 concurrent
# for their first 24h), so a rate-limited request fails on this route and is
# never retried onto another model or provider.
#
# Catalog verified from the public https://logfare.ai/v1/models (no key
# needed) on 2026-11-05:
#   - both ids serve chat/completions (also messages/responses);
#   - chat_capabilities.tools = true for both;
#   - deepseek-v4.1-flash-1017: enforced context_length 1048576, no output
#     cap, text+image input, reasoning on by default;
#   - glm-5.3: Logfare enforces context_length 262144 (its upstream_metadata
#     1M claim is NOT what Logfare serves; larger input is rejected 413),
#     text-only input, reasoning always on;
#   - both are premium (requires_training_optin): without the training
#     opt-in at https://logfare.ai/consent every request returns 403
#     training_optin_required. Account must also keep its Discord account in
#     the Logfare server (403 otherwise).
#
# `opencode_npm` registers base_url as a custom OpenCode provider. The
# credential reaches it as the env NAME only (OpenCode reads the key from
# that env var); no secret value ever enters config content or argv.
[providers.logfare]
label = "Logfare"
base_url = "https://logfare.ai/v1"
secret = "LOGFARE_API_KEY"
env = "LOGFARE_API_KEY"
default_model = "deepseek-v4.1-flash-1017"
models = ["deepseek-v4.1-flash-1017", "glm-5.3"]
opencode_npm = "@ai-sdk/openai-compatible"

# Mistral Education / Pro plan; Code > Vibe CLI PLAN key stored in Infisical
# as MISTRAL_API_KEY. Never use a pay-as-you-go API key here by accident.
# Included usage and API/Vibe limits are account-scoped. Turn pay-as-you-go
# OFF in Admin > Subscription for a hard account-side stop.
# Volume-first model: GLM 5.3 Flash (Mistral $0.15 input/$0.50 output per MTok).
# Never silently switch to a different model/provider on 401/402/429.
[providers.mistral]
label = "Mistral (Education)"
base_url = "https://api.mistral.ai/v1"
secret = "MISTRAL_API_KEY"
env = "MISTRAL_API_KEY"
require_infisical = true
default_model = "zai-glm-5-3-flash"
models = [
  "zai-glm-5-3-flash",
  "deepseek-v4-1-flash-1017",
  "zai-glm-5-3",
  "mistral-medium-3-5",
]

# Per-model contract for the opencode adapter; every model above needs an
# entry here (validated by `agent check`).
#   tool_call        <- chat_capabilities.tools (both true, 2026-11-05)
#   limit.context    <- Logfare's enforced context_length
#   limit.output     <- published upstream output cap (models.dev opencode
#                       catalog for the same models; Logfare enforces no
#                       output cap and lowers oversized max_tokens)
[providers.logfare.opencode_models."deepseek-v4.1-flash-1017"]
tool_call = true
limit = { context = 1048576, output = 384000 }

[providers.logfare.opencode_models."glm-5.3"]
tool_call = true
limit = { context = 262144, output = 131072 }

# ---------------------------------------------------------------------------
# Free-tier providers (no pay-as-you-go, no new subscription, $0/month)
#
# These exist so agent development can continue when the OpenCode Go / Zen
# allowance (or any other paid-plan allowance) is exhausted. They are explicit
# opt-in routes: nothing here is a fallback target, and no route may cross a
# billing boundary implicitly (see docs/adr/ADR-0018.md).
#
# Every provider below was measured live on 2026-11-13 through the real
# launcher harnesses (Claude Code 2.1.322, OpenCode 2.2.7, OMP 18.18.9) on a
# coding task that requires read + bash + edit + a verification run, plus a
# bug-fix task that requires reading a failing test suite, diagnosing, editing
# only the implementation file and re-verifying. Quality/role judgments are in
# docs/research/free-provider-evaluation-2026-11-13.md; attested facts are in
# the [catalog.*] tables below.
#
# The single invariant: a route listed here must be free to call, and the
# provider must reject an unentitled request instead of silently billing it.
# Where that cannot be proven, the provider is recorded as blocked
# (MODELSCOPE_API_KEY / SENSENOVA_API_KEY / SILICONFLOW_API_KEY today) and gets
# no route at all — a route that cannot be proven free must not be reachable.
# ---------------------------------------------------------------------------

# Kilo Gateway (https://kilocode.ai/docs/gateway). OpenAI-compatible gateway
# with Anthropic-compatible /v1/messages, so it serves BOTH the opencode and the
# claude adapters. The free slice is the `isFree` / `:free` models of the
# public catalog; `kilo-auto/free` is a server-side router over free models
# only (per Kilo's Auto model docs), while every other entry is one fixed id.
#
# Measured 2026-11-13 (KILO_API_KEY from Infisical, ambient key unset):
#   - GET /api/gateway/v1/models (no key needed): 473 models, 14 `isFree`;
#     all 14 report `tools` in supported_parameters;
#   - POST /api/gateway/v1/chat/completions and /api/gateway/v1/messages both
#     answer with `Authorization: Bearer` (the Anthropic path does not need
#     x-api-key); usage.cost = 0 and cost_details.* = 0 on free ids;
#   - Claude Code needs the base URL WITHOUT the trailing /v1 (it appends
#     `/v1/messages` itself); with `/v1` the gateway answers
#     `400 This endpoint only accepts the paths /chat/completions,
#     /responses and /messages`. OpenCode needs `/v1`.
#   - Full E2E (response + tools + real file edits, both harnesses) on
#     nvidia/nemotron-3-ultra-550b-a55b:free, kilo-auto/free,
#     cohere/north-mini-code:free and reflection/beam-free;
#   - `deepseek/deepseek-v4-flash:free` appears in the account-visible model
#     catalog but is rejected at request time ("does not exist"), so it is not
#     listed here.
#
# Data handling: every free id reports mayTrainOnYourPrompts = true and Kilo's
# own Auto Free warning says prompts may be logged by the upstream provider.
# Do not send credentials, customer data or private material on these routes.
#
# require_infisical = true: the whole point is "$0 on THIS account's free
# allowance", so the key must come from Infisical. A stale ambient KILO_API_KEY
# was observed to win the fast path and fail with "Your authentication token is
# invalid" (2026-11-13), which is exactly the silent wrong-account route this
# setting removes: the ambient value is stripped before the wrapper and a
# missing Infisical value fails instead.
[providers.kilo]
label = "Kilo Gateway (free models)"
base_url = "https://api.kilo.ai/api/gateway"
secret = "KILO_API_KEY"
env = "KILO_API_KEY"
require_infisical = true
default_model = "nvidia/nemotron-3-ultra-550b-a55b:free"
models = [
  "nvidia/nemotron-3-ultra-550b-a55b:free",
  "kilo-auto/free",
  "cohere/north-mini-code:free",
  "reflection/beam-free",
  "nvidia/nemotron-3.5-lightning:free",
]
opencode_npm = "@ai-sdk/openai-compatible"
# The launcher's `base_url` is shared by both adapters, so the OpenCode
# custom-provider block appends nothing: Kilo's OpenAI-compatible surface and
# its Anthropic surface sit under the same origin, and only the claude route
# needs the origin-without-/v1 spelling (see routes."claude.kilo").
opencode_base_url = "https://api.kilo.ai/api/gateway/v1"

[providers.kilo.opencode_models."nvidia/nemotron-3-ultra-550b-a55b:free"]
tool_call = true
limit = { context = 1000000, output = 65536 }

[providers.kilo.opencode_models."kilo-auto/free"]
tool_call = true
limit = { context = 256000, output = 32768 }

[providers.kilo.opencode_models."cohere/north-mini-code:free"]
tool_call = true
limit = { context = 256000, output = 64000 }

[providers.kilo.opencode_models."reflection/beam-free"]
tool_call = true
limit = { context = 1048576, output = 131072 }

[providers.kilo.opencode_models."nvidia/nemotron-3.5-lightning:free"]
tool_call = true
limit = { context = 1000000, output = 65536 }

# Requesty (https://docs.requesty.ai/features/free-models). OpenAI-compatible
# gateway that also serves Anthropic-compatible /v1/messages, so both adapters
# work. Free models are free "for now" per Requesty's docs and are limited per
# ORGANIZATION: 200 req/day and 20 req/min for a new organization, 1,000/day and
# 60/min once paying. The limits apply across all free models combined, so the
# whole provider is one shared allowance.
#
# Measured 2026-11-13 (REQUESTY_API_KEY from Infisical):
#   - GET /v1/models: 750 entries, 8 with input_price = output_price = 0;
#     all 8 report supports_tool_calling = true;
#   - POST /v1/chat/completions and /v1/messages answer with Bearer auth,
#     usage.cost = 0 on free ids; the Claude adapter needs the origin WITHOUT
#     /v1, OpenCode needs /v1;
#   - Full E2E (response + tools + real edits) on
#     nvidia/nemotron-3-ultra-550b-a55b, nvidia/nemotron-3.5-lightning-30b-a3b
#     and google/gemma-4-31b-it through Claude Code and OpenCode.
#   - Rejected: nvidia/nemotron-3-super-120b-a12b is still advertised in
#     models.dev but Requesty answers `404 no longer available`; it is not
#     listed. nvidia/muse-glimmer-30b and novita/ling-3.1-flash were not
#     exercised end to end and are not listed either.
#
# require_infisical = true for the same reason as kilo: the free allowance
# belongs to this organization, so an ambient REQUESTY_API_KEY must never be
# used (it could be another account's key and silently consume its budget).
[providers.requesty]
label = "Requesty (free models)"
base_url = "https://router.requesty.ai"
secret = "REQUESTY_API_KEY"
env = "REQUESTY_API_KEY"
require_infisical = true
default_model = "nvidia/nemotron-3-ultra-550b-a55b"
models = [
  "nvidia/nemotron-3-ultra-550b-a55b",
  "nvidia/nemotron-3.5-lightning-30b-a3b",
  "google/gemma-4-31b-it",
]
opencode_npm = "@ai-sdk/openai-compatible"
opencode_base_url = "https://router.requesty.ai/v1"

[providers.requesty.opencode_models."nvidia/nemotron-3-ultra-550b-a55b"]
tool_call = true
limit = { context = 1048576, output = 65536 }

[providers.requesty.opencode_models."nvidia/nemotron-3.5-lightning-30b-a3b"]
tool_call = true
limit = { context = 1048576, output = 65536 }

[providers.requesty.opencode_models."google/gemma-4-31b-it"]
tool_call = true
limit = { context = 262144, output = 8192 }

# OVHcloud AI Endpoints (https://docs.ovhcloud.com/en/guides/public-cloud/
# ai-machine-learning/ai-endpoints-capabilities). No key of any kind: the
# anonymous public tier is rate limited to 2 requests per minute per IP and per
# model and is OpenAI-compatible only (POST /v1/messages → 404), so it has an
# opencode route and no claude/omp route.
#
# Measured 2026-11-13:
#   - GET /v1/models (no auth): 21 entries; the chat-capable, non-zero-context
#     ids are Meta-Llama-3_3-70B-Instruct, gpt-oss-120b, gpt-oss-20b,
#     Mistral-Small-3.2-24B-Instruct-2506, Qwen3.5-397B-A17B, Qwen3.5-9B,
#     Qwen3.6-27B, Qwen3.8-27B. The catalog's `pricing.prompt` values are the
#     *authenticated* list prices, not the anonymous tier: the anonymous tier
#     is free but metered at 2 req/min;
#   - a request with NO Authorization header returns 200; a purposefully
#     invalid `Bearer sk-…` returns 403, so the endpoint does enforce a
#     presented credential;
#   - the 2 req/min budget is real: request 2 and 3 inside one minute return
#     429, and the window recovers after ~60s;
#   - Full E2E (response + tools + real edits) on gpt-oss-120b and
#     Meta-Llama-3_3-70B-Instruct through OpenCode. That is 2 requests, i.e.
#     exactly one anonymous window: an agentic task that needs more than a
#     couple of turns will hit 429 and must stop, not retry. Meta-Llama-3.3-70B
#     also timed out at 600s on the bug-fix task, so prefer gpt-oss-120b.
#
# Because this provider has NO credential, `anonymous = true` is what makes the
# launcher skip credential fetching entirely; it must never be combined with a
# secret name (config validation rejects that).
#
# Anonymous is only sound because the endpoint enforces a *presented* key: a
# request with no Authorization header is served (the anonymous tier), while a
# request carrying an invalid `Bearer sk-…` is rejected with 403 (measured
# 2026-11-13). So neither an ambient nor an injected credential can silently be
# used here, and the route cannot become somebody else's paid endpoint.
[providers.ovhcloud]
label = "OVHcloud AI Endpoints (anonymous free tier)"
base_url = "https://oai.endpoints.kepler.ai.cloud.ovh.net/v1"
anonymous = true
default_model = "gpt-oss-120b"
models = ["gpt-oss-120b", "gpt-oss-20b", "Meta-Llama-3_3-70B-Instruct"]
opencode_npm = "@ai-sdk/openai-compatible"

[providers.ovhcloud.opencode_models."gpt-oss-120b"]
tool_call = true
limit = { context = 131072, output = 131072 }

[providers.ovhcloud.opencode_models."gpt-oss-20b"]
tool_call = true
limit = { context = 131072, output = 131072 }

[providers.ovhcloud.opencode_models."Meta-Llama-3_3-70B-Instruct"]
tool_call = true
limit = { context = 131072, output = 131072 }

# GroqCloud (https://console.groq.com/docs/rate-limits). Free tier, no credit
# card: per organization, per model, 30 req/min, 1,000 req/day, 8,000 tokens/
# min and 200,000 tokens/day. The token budgets are the binding constraint, not
# the request count.
#
# Measured 2026-11-13 (GROQ_API_KEY from Infisical):
#   - GET /openai/v1/models: 11 ids; the chat ids are openai/gpt-oss-120b,
#     openai/gpt-oss-20b and qwen/qwen3.8-27b (131,072 context each);
#   - response headers confirm the free tier: x-ratelimit-limit-requests: 1000,
#     x-ratelimit-limit-tokens: 8000;
#   - a single raw tool-call request succeeds (response + tool_calls), but any
#     real harness turn already exceeds 8,000 TPM: OpenCode's system prompt
#     plus tools requested 9,853–10,703 tokens and was rejected with 429
#     "Request too large ... on tokens per minute (TPM): Limit 8000" at every
#     output budget tried (512/1024/2048/4096). OMP does complete the coding
#     and bug-fix tasks (response + bash/edit + bun test) because its prompt is
#     smaller, but takes 320s where Kilo does 23s at equal output.
#   - Therefore Groq is configured for OMP only: it is the one harness that can
#     stay under 8,000 TPM, it is slow but functional, and it is a genuine
#     third path when both Kilo and Requesty are limited. The opencode route is
#     deliberately absent rather than configured to fail every real turn.
#
# require_infisical = true: the 1,000 req/day allowance is per organization,
# so only the Infisical key may be used.
[providers.groq]
label = "GroqCloud (free tier)"
base_url = "https://api.groq.com/openai/v1"
secret = "GROQ_API_KEY"
env = "GROQ_API_KEY"
require_infisical = true
default_model = "openai/gpt-oss-120b"
models = ["openai/gpt-oss-120b", "openai/gpt-oss-20b", "qwen/qwen3.8-27b"]

# ---------------------------------------------------------------------------
# Harnesses: native command + adapter that knows how to select a provider.
# ---------------------------------------------------------------------------

[harnesses.claude]
label = "Claude Code"
command = "claude"
adapter = "anthropic"

[harnesses.opencode]
label = "OpenCode"
command = "opencode"
adapter = "opencode"

[harnesses.omp]
label = "Oh My Pi"
command = "omp"
adapter = "omp"

[harnesses.dsh]
label = "DeepSeek Harness (dsh)"
command = "dsh"
adapter = "passthrough"

# Browser-authenticated native Vibe, no Infisical injection.
[harnesses.vibe]
label = "Mistral Vibe CLI"
command = "vibe"
adapter = "passthrough"

# Claude adapter environment names (Claude Code's own protocol contract).
# These are names, never values; values are derived at launch time.
[harnesses.claude.env]
base_url = "ANTHROPIC_BASE_URL"
auth_token = "ANTHROPIC_AUTH_TOKEN"
api_key = "ANTHROPIC_API_KEY"
model = "ANTHROPIC_MODEL"
small_fast_model = "ANTHROPIC_SMALL_FAST_MODEL"
default_opus = "ANTHROPIC_DEFAULT_OPUS_MODEL"
default_sonnet = "ANTHROPIC_DEFAULT_SONNET_MODEL"
default_haiku = "ANTHROPIC_DEFAULT_HAIKU_MODEL"

# OpenCode environment names (model selection is config-driven; the global
# `opencode --model` flag does not exist in v2 and only prints help).
[harnesses.opencode.env]
config_content = "OPENCODE_CONFIG_CONTENT"

# ---------------------------------------------------------------------------
# Routes: explicit harness x provider combinations. A model id not covered
# here (and not listed under the route/provider models) fails before any
# process starts.
# ---------------------------------------------------------------------------

[routes."claude.openrouter"]
note = "Anthropic-compatible endpoint; every model role maps to the route model."

[routes."claude.openrouter-free"]
note = "Single fixed free model (pricing 0/0, live E2E on 2026-11-01); the paid openrouter route stays separate and is never a fallback here."

[routes."claude.opencode-go"]
default_model = "deepseek-v4.1-flash"
note = "Go endpoint; Infisical OPENCODE_API_KEY (single key, Go allowance selected by this endpoint). DeepSeek V4.1 Flash needs Privacy > Regions = Global. Real response + tool call verified 2026-11-01; no zen/pay-as-you-go fallback."

[routes."claude.deepseek"]
# The DeepSeek Anthropic endpoint maps claude-* names internally and silently
# maps anything else to deepseek-flash, so only the verified id is exposed.
models = ["deepseek-flash"]
note = "Anthropic-compatible endpoint; claude-* aliases are deliberately not exposed."

[routes."claude.minimax"]
note = "Default is the officially released MiniMax-M3.1-Flash; verify live M Plan access before rollout. Reasoning is always on, effort defaults to max. MiniMax-M3 remains selectable with --model."

[routes."opencode.zen"]
note = "Free zen models through the OpenCode client (free tier is client-bound)."

[routes."opencode.openrouter"]

[routes."opencode.openrouter-free"]
note = "Single fixed free model (pricing 0/0, live E2E on 2026-11-01); model ids are OpenRouter-native (`nvidia/nemotron-3-ultra-550b-a55b:free`)."

[routes."opencode.deepseek"]

[routes."opencode.minimax"]
# OpenCode previously silently ignored the Preview id when absent from its
# built-in catalog and fell back to Zen. Support for the formal ID has not
# been verified with this OpenCode route. Keep MiniMax-M3 as default and
# reject the unverified id until a live route/model verification passes.
default_model = "MiniMax-M3"
models = ["MiniMax-M3"]
note = "Keep MiniMax-M3 as the known working route default; the formal MiniMax-M3.1-Flash id needs a live OpenCode catalog/selection smoke test before it can be enabled. Unlisted ids are rejected with exit 2."

[routes."opencode.logfare"]
note = "Explicit Logfare route (OpenAI-compatible https://logfare.ai/v1, custom provider registered via opencode_npm). Never a fallback target and never selected implicitly: 5,000 req/day, 6 concurrent per account. Needs Infisical LOGFARE_API_KEY plus the /consent training opt-in (both models are premium). Real response + shell-tool call + both models verified 2026-11-05."

[routes."opencode.mistral"]
note = "Infisical Vibe plan key, volume-first GLM 5.3 Flash, no automatic paid or model fallback. Verify real model availability before use."

[routes."omp.openrouter"]

[routes."omp.openrouter-free"]
note = "Single fixed free model (pricing 0/0; Pi E2E 2026-11-01, OMP E2E 2026-11-04); omp_id = \"openrouter\" keeps the native OpenRouter provider id."

[routes."omp.opencode-go"]
default_model = "mimo-v2.6-flash"
note = "Go endpoint via OMP's native opencode-go provider. Real response + tool call verified 2026-11-04; no zen/pay-as-you-go/model fallback."

[routes."omp.mistral"]
note = "Infisical Vibe plan key, OMP worker safeguards and pinned GLM 5.3 Flash default; stored credentials/overrides rejected."

[routes."omp.deepseek"]
note = "OMP resolves the native DeepSeek provider; both provider ids (deepseek-flash, deepseek-v4-pro) remain selectable. Live call reached the provider but the account returned HTTP 402 Insufficient Balance on 2026-11-04, so response/tool success is unverified; no fallback."

[routes."omp.minimax"]
note = "Default is the officially released MiniMax-M3.1-Flash. OMP selects the explicit model id; MiniMax-M3 remains selectable with --model. Live call reached the provider but the M Plan account returned HTTP 429 Token Plan limit on 2026-11-04, so response/tool success is unverified; no fallback."

[routes."dsh.deepseek"]
note = "Passthrough: dsh keeps its own native DeepSeek provider and auth (unverified here)."

# ---------------------------------------------------------------------------
# Free-tier routes (no pay-as-you-go, no new subscription). Explicit opt-in
# only — no route here is a fallback target, and `agent` still forbids implicit
# switching. See docs/adr/ADR-0018.md for the policy and
# docs/research/free-provider-evaluation-2026-11-13.md for the measurements.
#
# Role split, from the 2026-11-13 evaluation (both harnesses passed a real
# coding task and a real bug-fix task unless noted):
#   - kilo.ultra      first choice: fast (20-40s), correct, 1M context, tools
#   - kilo.auto-free  equal quality, server-side free-model router
#   - kilo.north      code-specialist alternative (256k context)
#   - kilo.beam       largest context (1M) but ~4x slower (158s)
#   - requesty.ultra  independent path once Kilo's allowance is exhausted
#   - ovh.oss120b     last resort: 2 req/min, no credential at all
#   - groq.oss120b    OMP only: 8k TPM budget, slow but functional
# ---------------------------------------------------------------------------

[routes."claude.kilo"]
default_model = "nvidia/nemotron-3-ultra-550b-a55b:free"
note = "Kilo free models via the Anthropic-compatible gateway at the bare origin (base_url appends /v1/messages). Real response + tools + edits verified 2026-11-13. Prompts may be used for training: no secrets/customer data."

[routes."opencode.kilo"]
default_model = "nvidia/nemotron-3-ultra-550b-a55b:free"
note = "Kilo free models via the OpenAI-compatible /v1 surface (opencode_base_url). Real response + tools + edits verified 2026-11-13 on four free ids."

[routes."omp.kilo"]
default_model = "nvidia/nemotron-3-ultra-550b-a55b:free"
note = "Kilo free models through OMP's native kilo provider. Real response + tools + edits verified 2026-11-13 (OMP 18.18.9). No fallback chain is allowed on any omp route."

[routes."claude.requesty"]
default_model = "nvidia/nemotron-3-ultra-550b-a55b"
note = "Requesty free models via the Anthropic-compatible gateway at the bare origin. Real response + tools + edits verified 2026-11-13. Free allowance is organization-wide: 200 req/day, 20 req/min for a new organization."

[routes."opencode.requesty"]
default_model = "nvidia/nemotron-3-ultra-550b-a55b"
note = "Requesty free models via the OpenAI-compatible /v1 surface. Real response + tools + edits verified 2026-11-13 on three free ids."

[routes."opencode.ovhcloud"]
default_model = "gpt-oss-120b"
note = "Anonymous free tier: NO credential of any kind (anonymous = true). 2 req/min per IP and per model, so an agentic turn that needs more than a couple of requests hits 429 and must stop. Real response + tools + edits verified 2026-11-13. No claude/omp route: the endpoint is OpenAI-compatible only and OMP has no credential-free contract."

[routes."omp.groq"]
default_model = "openai/gpt-oss-120b"
note = "Groq free tier through OMP only. 8,000 tokens/min is the binding limit: OpenCode's prompt+tools already requests ~10k and is rejected, while OMP completes real tasks but slowly (320s vs 23s on Kilo). Real response + tools + edits verified 2026-11-13."

# ---------------------------------------------------------------------------
# Catalog metadata (issue #89 / T003, Epic #86): capability, pricing and
# terms metadata for providers, models and routes.
#
# ADDITIVE and advisory: the launcher (script/agent.ts) ignores this table;
# launch behavior is defined exclusively by the tables above.
# script/agent/catalog.ts validates every entry against
# script/agent/contract.ts (Attested / Evidence / QuotaScope) and rejects
# invalid route/model references, attestation-matrix violations and price
# claims without provider-published or measured evidence.
#
# Rules:
#   - Every fact is an Attested value: { value, status, provenance,
#     evidence [, note] }. Absent = UNKNOWN: nothing is invented here; a
#     fact without an entry simply does not exist yet.
#   - provenance separates the three authority classes: `official`
#     (provider-published catalog/docs), `measured` (our own live E2E /
#     probe), `estimated` (config-side judgment). Prices and quotas must be
#     official or measured, or explicitly config-declared (`estimated` with
#     evidence source `config`) when only a repo comment is the source.
#   - evidence.at is the observation date (day precision, UTC midnight);
#     evidence.sha pins the commit that recorded the observation.
#   - Quota scopes identify the SHARED allowance (quotaScopeKey in
#     script/agent/contract.ts): routes drawing on the same account/plan
#     allowance carry the SAME scope key, so concurrent machines and
#     parallel routes never double-count one account's quota. Scope ids
#     name accounts, plans or Infisical secret NAMES — never secret values.
# ---------------------------------------------------------------------

