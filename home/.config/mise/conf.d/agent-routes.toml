# User-global mise tasks managed by rebuildup/dotfiles.
# Loaded from ~/.config/mise/conf.d/ and usable from any working directory.
# Keep `claude` itself native and unmodified. Opt-in to an API via mise run.
# Credentials are injected by existing dotfiles/script/with-secrets (Infisical dev).
# No automatic paid fallback, aliases, or credential changes.
#
# NOTE: The existing Infisical project injects its entire dev secret set into the
# task process. This is suitable only for trusted local interactive agents;
# isolate untrusted workers with scoped Infisical identities/projects.
#
[tasks."agent:claude:openrouter"]
description = "Claude Code via OpenRouter (API)"
dir = "{{ cwd }}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec "$HOME/.dotfiles/script/with-secrets" bash -c '
  key="${OPENROUTER_API_KEY:?OPENROUTER_API_KEY not set in Infisical}"
  export ANTHROPIC_BASE_URL=https://openrouter.ai/api ANTHROPIC_AUTH_TOKEN="$key"
  unset ANTHROPIC_API_KEY
  export ANTHROPIC_MODEL="${AGENT_MODEL:-z-ai/glm-5.3-flash}"
  export ANTHROPIC_DEFAULT_SONNET_MODEL="$ANTHROPIC_MODEL" ANTHROPIC_DEFAULT_OPUS_MODEL="$ANTHROPIC_MODEL" ANTHROPIC_DEFAULT_HAIKU_MODEL="$ANTHROPIC_MODEL"
  exec claude "$@"
' bash "$@"
'''

