[tasks."agent:pi:openrouter"]
description = "Pi via OpenRouter"
dir = "{{ cwd }}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec "$HOME/.dotfiles/script/with-secrets" bash -c '
  : "${OPENROUTER_API_KEY:?OPENROUTER_API_KEY missing}"
  exec pi --provider openrouter --model "${AGENT_MODEL:-z-ai/glm-5.3-flash}" "$@"
' bash "$@"
'''

